<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Svah followerov</title>
<meta name="description" content="Každý follower @svah.followerov má na svahu svojho lyžiara. Nájdi sa a povzbuď ho!">
<meta property="og:title" content="Svah followerov">
<meta property="og:description" content="Nájdi svojho lyžiara na svahu a povzbuď ho kravskými zvoncami.">
<meta name="theme-color" content="#1E5AA8">
<style>
  /* Rozloženie: 3D svah na celú obrazovku, hore strediskový panel s vyhľadávaním, dole karta lyžiara. */
  :root{
    --ink:#22262d; --blue:#1E5AA8; --snow:#F4F6F9; --red:#C8102E; --amber:#F2B705;
    --glass:rgba(255,255,255,.94); --line:rgba(34,38,45,.12); --muted:#5d6672;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#dce8f4;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .lbl{position:absolute;left:0;top:0;font-size:11px;font-weight:700;will-change:transform;
    background:rgba(34,38,45,.8);color:#fff;padding:2px 6px;border-radius:6px;white-space:nowrap}
  .lbl.sel{background:var(--blue);font-size:13px;padding:4px 9px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .lbl.vip{background:var(--red)}

  #top{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));
    max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:8px;z-index:5}
  .board{display:flex;align-items:center;gap:10px;background:var(--blue);color:#fff;
    border-radius:14px;padding:8px 12px;box-shadow:0 4px 14px rgba(0,0,0,.18);border:2px solid #fff}
  .board .ic{width:38px;height:38px;border-radius:9px;background:#fff;color:var(--blue);
    display:grid;place-items:center;flex:none}
  .board .t{flex:1;line-height:1.15;min-width:0}
  .board .t b{display:block;font-size:16px;font-weight:800}
  .board .t span{font-size:12px;opacity:.85}
  .board .cnt{text-align:right;line-height:1}
  .board .cnt small{display:block;font-size:9px;letter-spacing:.12em;font-weight:700;opacity:.85}
  .board .cnt b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}

  .search{position:relative}
  .search input{width:100%;font-size:16px;padding:11px 12px 11px 38px;border-radius:12px;
    border:1px solid var(--line);background:var(--glass);color:var(--ink);outline:none;
    box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .search input:focus{border-color:var(--blue)}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.55}
  #sug{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border-radius:12px;
    box-shadow:0 8px 24px rgba(0,0,0,.18);overflow:hidden;display:none;max-height:50vh;overflow-y:auto}
  #sug button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;
    padding:10px 12px;font-size:15px;text-align:left;cursor:pointer;color:var(--ink)}
  #sug button:hover,#sug button.on{background:#eef3fa}
  .dot{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.15);display:inline-block}
  #sug .n{margin-left:auto;font-size:12px;color:var(--muted)}

  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:0;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700;
    background:var(--ink);color:#fff;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .chip.light{background:var(--glass);color:var(--ink)}
  .chip:focus-visible,#cheer:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

  #card{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));
    max-width:480px;margin:0 auto;background:#fff;border-radius:16px;padding:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);display:none;z-index:6}
  #card .row{display:flex;align-items:center;gap:10px}
  .bib{width:54px;height:54px;border-radius:10px;background:var(--snow);border:2px solid var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
  .bib small{font-size:8px;font-weight:800;letter-spacing:.1em;color:var(--muted)}
  .bib b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
  #card .who{flex:1;min-width:0}
  #card .who b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #card .who span{font-size:12px;color:var(--muted)}
  #cheer{border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;
    font-size:14px;padding:11px 14px;cursor:pointer;display:flex;align-items:center;gap:6px}
  #cheer:active{transform:scale(.96)}
  #close{position:absolute;right:8px;top:-12px;width:28px;height:28px;border-radius:50%;
    border:0;background:var(--ink);color:#fff;font-size:16px;cursor:pointer}
  .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12px}
  .meta>span{background:#f0f2f5;border-radius:8px;padding:4px 8px}
  .meta .live{background:#e7f0fb;color:var(--blue);font-weight:700}
  .comment{margin-top:8px;font-size:13px;background:#eef3fa;border-radius:10px;padding:8px 10px}
  .comment:empty{display:none}

  #cta{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));
    max-width:480px;margin:0 auto;background:var(--ink);color:#fff;border-radius:14px;
    padding:10px 14px;font-size:13px;line-height:1.4;z-index:4;box-shadow:0 6px 18px rgba(0,0,0,.25)}
  #cta a{color:#9cc3ff;font-weight:700}
  #demo{position:fixed;right:10px;top:50%;writing-mode:vertical-rl;background:var(--red);color:#fff;
    font-size:11px;font-weight:800;padding:8px 4px;border-radius:6px;display:none;z-index:7}
  #loading{position:fixed;inset:0;display:grid;place-items:center;background:#dce8f4;z-index:20;
    font-weight:800;color:var(--blue);font-size:18px;transition:opacity .6s}
  #err{display:none;position:fixed;left:12px;right:12px;bottom:12px;background:#fff;padding:12px;border-radius:12px;z-index:30}
  @media (min-width:900px){ #top{left:20px;right:auto;width:420px;margin:0} #card,#cta{left:20px;right:auto;width:420px;margin:0} }
</style>

  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<div id="top">

      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20 L10 8 L14 14 L17 10 L21 20 Z"/><path d="M8.5 10.5 L10 8 L11.6 10.6"/></svg>

  </div>
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>

</div>

<div id="cta">Nie si na svahu? Daj follow <a id="igLink" href="https://www.instagram.com/svah.followerov/" target="_blank" rel="noopener">@svah.followerov</a> a pod reel napíš <b>farbu bundy</b> a <b>lyže / snowboard / sánky</b>. Do pár dní tu jazdíš. Zmeniť si to môžeš kedykoľvek novým komentom.</div>

<div id="card">
  <button id="close" aria-label="Zavrieť">×</button>

    <div class="bib"><small>ŠTART</small><b id="cNum">1</b></div>

    <span id="cCheers"></span>

</div>

<script>
/* ===== DÁTA: followeri, ktorí sa sami prihlásili komentom (opt-in) =====
   Poradie = poradie príchodu = štartovné číslo.
   u = meno na Instagrame, t = typ (lyziar | snowboardista | sankar | skialpinista | bobista | telemark),
   c = farba bundy (hex, prázdne = podľa mena), k = ich komentár */
window.FOLLOWERS = [
  { u: "svah.followerov", t: "lyziar", c: "#1E5AA8", k: "Prvá stopa je moja. Kto ide so mnou?" }
];
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ---------- pomocné ---------- */
const $ = id => document.getElementById(id);
function hash(s){ let h=2166136261>>>0; for(const ch of s){ h^=ch.codePointAt(0); h=Math.imul(h,16777619)>>>0 } return h }
function rng(seed){ let a=seed>>>0; return ()=>{ a=(a+0x6D2B79F5)>>>0; let t=a; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296 } }
const ease = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
const fmt = n => n.toLocaleString('sk-SK');
const lin = h => { const c=new THREE.Color(h); return [c.r,c.g,c.b]; };

/* ---------- typy ---------- */
const TYPES = [
  { key:'lyziar',        name:'lyžiar',        amp:.62, per:3.2, down:80,  lift:1, bell:880  },
  { key:'snowboardista', name:'snowboardista', amp:.80, per:4.4, down:85,  lift:1, bell:740  },
  { key:'sankar',        name:'sánkar',        amp:.18, per:7.0, down:120, lift:1, bell:620  },
  { key:'skialpinista',  name:'skialpinista',  amp:.30, per:5.0, down:75,  lift:0, bell:990  },
  { key:'bobista',       name:'bobista',       amp:.55, per:1.7, down:60,  lift:1, bell:1100 },
  { key:'telemark',      name:'telemarkár',    amp:.85, per:5.5, down:95,  lift:1, bell:660  },
];
const TYPE_IDX = Object.fromEntries(TYPES.map((t,i)=>[t.key,i]));
const PALETTE = ['#1E5AA8','#C8102E','#F2B705','#2E9E5B','#7A3FB8','#F26B21','#0FA3B1','#E84A8A','#2B2D31','#8BC34A','#FFFFFF','#6D4C41'];
const COLOR_NAMES = {'#1E5AA8':'modrá','#C8102E':'červená','#F2B705':'žltá','#2E9E5B':'zelená','#7A3FB8':'fialová','#F26B21':'oranžová','#0FA3B1':'tyrkysová','#E84A8A':'ružová','#2B2D31':'čierna','#8BC34A':'svetlozelená','#FFFFFF':'biela','#6D4C41':'hnedá'};

/* ---------- dáta ---------- */
const params = new URLSearchParams(location.search);
const REEL = params.has('reel');
let raw = window.FOLLOWERS.slice();
const demoN = Math.min(60000, parseInt(params.get('demo')||'0',10)||0);
if (demoN > raw.length){
  const r = rng(7);
  for (let i=raw.length; i<demoN; i++) raw.push({ u:'ukazka_'+String(i+1).padStart(5,'0'), t:TYPES[Math.floor(r()*6)].key, c:'', k:'' });
  $('demo').style.display='block';
}
const people = raw.map((p,i)=>{
  const h = hash(p.u);
  const ti = (p.t in TYPE_IDX) ? TYPE_IDX[p.t] : h % 6;
  const c = (p.c && /^#[0-9a-f]{6}$/i.test(p.c)) ? p.c.toUpperCase() : PALETTE[h % PALETTE.length];
  return { u:p.u, k:p.k||'', i, num:i+1, ti, c, h, vip:i<100,
    lane: ((h>>>8)%1000)/1000*2-1,
    phase: ((h>>>4)%997)/997,
    down: TYPES[ti].down*(.85+.3*(((h>>>12)%100)/100)) };
});
const N = people.length;

/* ---------- svet ---------- */
const CAP=250, H=430, RAD=1600, LIFT_V=5.5, TSP=50, SK=1.9;
function height(r, th){
  const PL=95, rr=Math.max(r,PL), k=Math.max(0,1-rr/RAD);
  const x=Math.min(1,Math.max(0,(r-PL)/70)), w=x*x*(3-2*x);
  const ridge=1+w*(.06*Math.sin(3*th+.4)+.045*Math.sin(7*th+1.3)+.025*Math.sin(13*th));
  return H*Math.pow(Math.max(k,1e-6),1.35)*ridge + w*6*k*Math.sin(r*.012+th*5);
}
const groundAt = (x,z) => height(Math.hypot(x,z), Math.atan2(z,x));
const RINGS=[{n:12,start:80,off:0},{n:12,start:230,off:.5},{n:24,start:390,off:.25},{n:48,start:560,off:.125},{n:96,start:720,off:.0625}];
const SLOTS=[];
RINGS.forEach(rg=>{ for(let j=0;j<rg.n;j++) SLOTS.push({ th:(j+rg.off)/rg.n*Math.PI*2-Math.PI/2, r0:rg.start, len:Math.min(800,1480-rg.start) }); });
const RUNS = SLOTS.slice(0, Math.min(SLOTS.length, Math.max(1,Math.ceil(N/CAP)))).map((s,k)=>({
  ...s, k, chair:false, color:['#1E5AA8','#C8102E','#2B2D31'][k%3],
  LL: 34, TH: 7.5 }));
const runOf = i => RUNS[Math.min(RUNS.length-1, Math.floor(i/CAP))];
$('count').textContent = fmt(N);
{ const n=RUNS.length; $('runsInfo').textContent = n+' '+(n===1?'zjazdovka':n<5?'zjazdovky':'zjazdoviek')+' · poma'; }

const _a=new THREE.Vector3(), _b=new THREE.Vector3();
function runPt(run,s,lat,out){ const r=run.r0+s*run.len, t=run.th+lat/r; return out.set(r*Math.cos(t),height(r,t),r*Math.sin(t)); }
function cabY(run,d,lat,TH){
  const d0=Math.floor(d/TSP)*TSP, d1=Math.min(run.len,d0+TSP), f=d1>d0?(d-d0)/(d1-d0):0;
  const a=runPt(run,d0/run.len,lat,_a).y, b=runPt(run,d1/run.len,lat,_b).y;
  return a+(b-a)*f+TH-.8*4*f*(1-f);
}

/* JS kópia pohybu z GPU (na menovky, kameru a ťuknutie) */
let JUMP_ID=-1, JUMP_T=-99;
function skierOrg(p, t, out){
  const run=runOf(p.i), T=TYPES[p.ti], len=run.len, upd=len/LIFT_V, dn=p.down, cyc=dn+upd;
  const u=((t+p.phase*cyc)%cyc+cyc)%cyc;
  let s, lat, mode;
  if (u<dn){ s=u/dn; const ph=(u/T.per)*Math.PI*2+p.phase*6.28; lat=Math.min(18,Math.max(-18,p.lane*7+Math.sin(ph)*T.amp*12)); mode='down'; }
  else { s=1-(u-dn)/upd; if(T.lift){ lat=run.LL; mode=run.chair?'chair':'tbar'; } else { lat=-17.5; mode='walk'; } }
  runPt(run,s,lat,out); out.y+=.25;
  if (mode==='chair') out.y = cabY(run,s*len,run.LL,run.TH)-4.5-.32*SK;
  if (p.ti===1 && mode==='down'){ const j=(u%23)/23; if(j<.05) out.y+=Math.sin(j/.05*Math.PI)*2.5; }
  if (p.i===JUMP_ID){ const k=(t-JUMP_T)/1.4; if(k>0&&k<1) out.y+=Math.sin(k*Math.PI)*9; }
  out.mode=mode; out.s=s;
  return out;
}

/* ---------- renderer ---------- */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:innerWidth*innerHeight*devicePixelRatio*devicePixelRatio<2.4e6,powerPreference:'high-performance'});
const prFor=()=>Math.max(.75,Math.min(devicePixelRatio, innerWidth<700?1.5:1.75, Math.sqrt(2.2e6/(innerWidth*innerHeight))));
let PR = prFor();
renderer.setPixelRatio(PR);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.0;
const scene=new THREE.Scene();
scene.fog=new THREE.Fog('#dbe7f3', 2600, 11000);
const camera=new THREE.PerspectiveCamera(45,1,1,16000);
const controls=new OrbitControls(camera,canvas);
controls.enableDamping=true; controls.dampingFactor=.08;
controls.maxPolarAngle=Math.PI*.48; controls.minDistance=8; controls.maxDistance=5000;

const SUN_DIR=new THREE.Vector3(-.55,.62,.56).normalize();
scene.add(new THREE.HemisphereLight('#f4f8ff','#93a6bd',1.05));
const sun=new THREE.DirectionalLight('#fff0d8',2.1); sun.position.copy(SUN_DIR).multiplyScalar(1000); scene.add(sun);

/* obloha so slnkom */
{
  const m=new THREE.ShaderMaterial({ side:THREE.BackSide, depthWrite:false, fog:false,
    uniforms:{ sunDir:{value:SUN_DIR} },
    vertexShader:'varying vec3 vD; void main(){ vD=normalize(position); vec4 p=projectionMatrix*modelViewMatrix*vec4(position,1.); gl_Position=p.xyww; }',
    fragmentShader:'uniform vec3 sunDir; varying vec3 vD; void main(){ float h=vD.y; vec3 top=vec3(.20,.47,.82), hor=vec3(.86,.91,.96), gr=vec3(.86,.9,.95); vec3 c=mix(hor,top,smoothstep(0.0,.55,h)); c=mix(c,gr,smoothstep(0.0,-.15,h)); float sd=max(dot(vD,sunDir),0.0); c+=vec3(1.,.93,.78)*(pow(sd,900.)*1.6+pow(sd,10.)*.22); gl_FragColor=vec4(c,1.); }' });
  const sky=new THREE.Mesh(new THREE.SphereGeometry(12000,32,16),m); sky.frustumCulled=false; sky.renderOrder=-1; scene.add(sky);
}

/* vzdialené pohorie */
{
  const r=rng(11), geos=[], caps=[];
  for(let i=0;i<34;i++){
    const th=i/34*Math.PI*2+r()*.12, d=5200+r()*2200, h=500+r()*900, w=700+r()*900;
    const g=new THREE.ConeGeometry(w,h,7,1); g.translate(d*Math.cos(th),h/2-60,d*Math.sin(th)); geos.push(g);
    const c=new THREE.ConeGeometry(w*.34,h*.34,7,1); c.translate(d*Math.cos(th),h-h*.17-60+1,d*Math.sin(th)); caps.push(c);
  }
  scene.add(new THREE.Mesh(mergeGeometries(geos),new THREE.MeshLambertMaterial({color:'#9fb3ca',flatShading:true})));
  scene.add(new THREE.Mesh(mergeGeometries(caps),new THREE.MeshLambertMaterial({color:'#f3f7fb',flatShading:true})));
}

/* terén */
{
  const RS=150, TS=240, Rmax=4200;
  const pos=[], col=[], idx=[];
  const off=new THREE.Color('#e3ebf4'), shade=new THREE.Color('#c7d5e5'), valley=new THREE.Color('#edf2f7'), c=new THREE.Color();
  for(let i=0;i<=RS;i++){
    const r=Math.pow(i/RS,1.7)*Rmax;
    for(let j=0;j<TS;j++){
      const th=j/TS*Math.PI*2, y=height(r,th);
      pos.push(r*Math.cos(th),y,r*Math.sin(th));
      const n=.5+.5*Math.sin(th*11+r*.013)*Math.cos(r*.021-th*3);
      c.copy(off).lerp(shade,(1-Math.min(1,y/H))*.28*n).lerp(valley,Math.min(1,Math.max(0,(r-RAD)/600)));
      col.push(c.r,c.g,c.b);
    }
  }
  for(let i=0;i<RS;i++) for(let j=0;j<TS;j++){
    const a=i*TS+j, b=i*TS+(j+1)%TS, cc=(i+1)*TS+j, d=(i+1)*TS+(j+1)%TS;
    idx.push(a,b,cc, b,d,cc);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx); g.computeVertexNormals();
  scene.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true})));
}

/* textúra upraveného snehu (manšestr) */
const cordTex=(()=>{
  const cv=document.createElement('canvas'); cv.width=64; cv.height=4; const x=cv.getContext('2d');
  x.fillStyle='#ffffff'; x.fillRect(0,0,64,4);
  for(let i=0;i<64;i+=8){ x.fillStyle='#e8eef6'; x.fillRect(i,0,3,4); x.fillStyle='#f3f6fa'; x.fillRect(i+3,0,1,4); }
  const t=new THREE.CanvasTexture(cv); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=8; return t;
})();

function ribbon(run, latFrom, latTo, acrossSegs, fadeFrac, colorCenter){
  const along=Math.ceil(run.len/5), pos=[], col=[], uv=[], idx=[];
  const cOff=new THREE.Color('#e3ebf4'), cIn=new THREE.Color(colorCenter), c=new THREE.Color(), P=new THREE.Vector3();
  for(let i=0;i<=along;i++){
    const s=i/along;
    for(let j=0;j<=acrossSegs;j++){
      const f=j/acrossSegs, lat=latFrom+(latTo-latFrom)*f;
      const e=Math.min(1,Math.min(f,1-f)/fadeFrac), w=e*e*(3-2*e);
      runPt(run,s,lat,P);
      pos.push(P.x,P.y+.06+.19*w,P.z);

}

function instGeo(base, list, run){
  const g=new THREE.InstancedBufferGeometry();
  for(const k in base.attributes) g.setAttribute(k,base.attributes[k]);
  const n=list.length, aRun=new Float32Array(n*4), aP=new Float32Array(n*4), aId=new Float32Array(n), col=new Float32Array(n*3), c=new THREE.Color();
  list.forEach((p,j)=>{
    aRun.set([run.th,run.r0,run.len,run.chair?1:0],j*4);
    aP.set([p.lane,p.phase,p.down,p.ti],j*4);
    aId[j]=p.i; c.set(p.c); col.set([c.r,c.g,c.b],j*3);
  });
  g.setAttribute('aRun',new THREE.InstancedBufferAttribute(aRun,4));
  g.setAttribute('aP',new THREE.InstancedBufferAttribute(aP,4));
  g.setAttribute('aId',new THREE.InstancedBufferAttribute(aId,1));
  g.setAttribute('color',new THREE.InstancedBufferAttribute(col,3));
  g.setAttribute('aHide',new THREE.InstancedBufferAttribute(new Float32Array(n),1).setUsage(THREE.DynamicDrawUsage));
  g.instanceCount=n; return g;
}
function carrierGeo(run){
  const base=run.chair?chairCarrier:tbarCarrier, sp=run.chair?22:14, n=Math.floor(2*run.len/sp);
  const g=new THREE.InstancedBufferGeometry();
  for(const k in base.attributes) g.setAttribute(k,base.attributes[k]);
  const aRun=new Float32Array(n*4), aOff=new Float32Array(n);
  for(let j=0;j<n;j++){ aRun.set([run.th,run.r0,run.len,run.chair?1:0],j*4); aOff[j]=j*sp; }
  g.setAttribute('aRun',new THREE.InstancedBufferAttribute(aRun,4));
  g.setAttribute('aOff',new THREE.InstancedBufferAttribute(aOff,1));
  g.instanceCount=n; return g;
}

let actx;
function cowbell(base){
  actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const now=actx.currentTime;
  for(let r=0;r<3;r++){
    const t0=now+r*.16+Math.random()*.03, g=actx.createGain(); g.connect(actx.destination);
    g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(.32,t0+.005); g.gain.exponentialRampToValueAtTime(.0001,t0+.6);
    const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=base*1.3; bp.Q.value=2.5; bp.connect(g);
    for(const mul of [1,1.48]){ const o=actx.createOscillator(); o.type='square'; o.frequency.value=base*mul*(1+(Math.random()-.5)*.01); o.connect(bp); o.start(t0); o.stop(t0+.65); }
  }
}
$('cheer').onclick=()=>{
  if(selected<0) return;
  const p=people[selected];
  cowbell(TYPES[p.ti].bell);
  JUMP_ID=p.i; JUMP_T=simT(); U.uJumpId.value=JUMP_ID; U.uJumpT.value=JUMP_T;
  cheers[p.u]=(cheers[p.u]||0)+1;
  try{ localStorage.setItem('svah_cheers',JSON.stringify(cheers)); }catch(e){}
  updateCheerCount();
};

const t0=performance.now();
const simT=()=>(performance.now()-t0)/1000+1000;
let slowFrames=0, lastNow=performance.now();
const nearRuns=new Set();
function loop(now){
  if(REEL) return;
  const dt=now-lastNow; lastNow=now;
  if(dt>30){ if(++slowFrames>45 && PR>.75){ PR=Math.max(.75,PR-.2); renderer.setPixelRatio(PR); resize(); slowFrames=0; } } else slowFrames=Math.max(0,slowFrames-1);
  const t=simT(); U.uTime.value=t;
  // detailné postavy len pre blízke zjazdovky
  nearRuns.clear();
  for(const o of runObjs){
    const d=distSeg(camera.position,o.a,o.b);
    o.carriers.visible=d<1100;
    if(d<200) nearRuns.add(o);
  }
  if(selected>=0) nearRuns.add(runObjs[runOf(selected).k]);
  updatePositions(t, nearRuns);
  updateDetail(nearRuns);
  if(flying){
    const k=Math.min(1,(now-flying.start)/flying.dur), e=ease(k);
    if(selected>=0){ flying.t1.set(positions[selected*3],positions[selected*3+1]+1.5,positions[selected*3+2]); flying.p1.copy(flying.t1).add(followOff); }
    camera.position.lerpVectors(flying.p0,flying.p1,e); controls.target.lerpVectors(flying.t0,flying.t1,e);
    if(k>=1){ flying=null; if(selected>=0) lastSel.copy(controls.target); }
  } else if(selected>=0){
    const cur=V1.set(positions[selected*3],positions[selected*3+1]+1.5,positions[selected*3+2]);
    const d=V2.copy(cur).sub(lastSel);
    if(d.lengthSq()<400){ camera.position.add(d); controls.target.add(d); }
    lastSel.copy(cur);
  }
  controls.update();
  const g=groundAt(camera.position.x,camera.position.z)+4;
  if(camera.position.y<g) camera.position.y=g;
  const sp=snow.geometry.attributes.position.array;
  for(let i=1;i<sp.length;i+=3){ sp[i]-=.3; if(sp[i]<0) sp[i]+=260; }
  snow.geometry.attributes.position.needsUpdate=true;
  snow.position.set(camera.position.x,camera.position.y-130,camera.position.z);
  renderer.render(scene,camera);
  updateLabels(nearRuns);
  requestAnimationFrame(loop);
}

async function startReel(){
  const W=1080, H2=1920, FPS=30, SR=48000, NS=7;
  for(const id of ['top','cta','card','labels','demo']){ const e=$(id); if(e) e.style.display='none'; }
  const stEl=document.createElement('div'); stEl.style.cssText='position:fixed;left:12px;top:12px;z-index:60;background:#fff;padding:10px 14px;border-radius:10px;font:600 14px system-ui;max-width:90vw'; document.body.appendChild(stEl);
  const say=t=>{ stEl.textContent=t; window.__reelStatus=t; };
  canvas.style.display='none';
  renderer.setPixelRatio(1); renderer.setSize(W,H2,false);
  camera.aspect=W/H2; camera.fov=58; camera.near=.5; camera.updateProjectionMatrix();
  const fl=document.createElement('link'); fl.rel='stylesheet'; fl.href='https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap'; document.head.appendChild(fl);
  try{ await new Promise(r=>{ fl.onload=r; setTimeout(r,4000); }); await document.fonts.load('800 80px Poppins'); await document.fonts.load('600 40px Poppins'); }catch(e){}
  const FONT='Poppins, system-ui, -apple-system, Arial, sans-serif';

  const idb=()=>new Promise((res,rej)=>{ const r=indexedDB.open('svah',1); r.onupgradeneeded=()=>r.result.createObjectStore('f'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
  const dbGet=async k=>{ const d=await idb(); return new Promise((res,rej)=>{ const r=d.transaction('f').objectStore('f').get(k); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); };
  const dbPut=async(k,v)=>{ const d=await idb(); return new Promise((res,rej)=>{ const t=d.transaction('f','readwrite'); t.objectStore('f').put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); };

  say('Načítavam hlas…');
  const SCRIPT=params.get('script')||'1';
  const SC={
    '1':{voice:'voice',out:'reel',chips:'colors',lens:[17,37,96,77,53,44,21],caps:[['Toto je *náš svah*'],['Zatiaľ tu jazdí','iba *1 lyžiar*'],['Daj *follow*','a dostaneš vlastného','lyžiara na svahu'],['Do komentu napíš','*farbu bundy*','a čím jazdíš'],['Zmeniť si to môžeš','*kedykoľvek*','novým komentom'],['Svojho lyžiara','nájdeš cez *odkaz v bio*']]},
    '2':{voice:'voice2',out:'reel2',chips:'upgrades',lens:[24,63,75,82,59,34,21],caps:[['Svah followerov','*už beží*'],['Zatiaľ jazdíme','na *pume*'],['Daj *follow*','a dostaneš vlastného','lyžiara na svahu'],['Viac followerov =','*lanovka*','a *nové zjazdovky*'],['Čo pridáme ďalej?','Napíš *nápad*','do komentu 👇'],['Noví lyžiari','pribudnú *zajtra*']]}
  }[SCRIPT]||null;
  if(!SC){ say('Neznámy scenár '+SCRIPT); return; }
  const voiceBlob=await dbGet(SC.voice);
  let voice=null;
  if(voiceBlob){ const ac=new OfflineAudioContext(2,SR,SR); voice=await ac.decodeAudioData(await voiceBlob.arrayBuffer()); }
  const VO=0.35, vDur=voice?voice.duration:24;
  const DUR=Math.ceil((VO+vDur+1.8)*FPS)/FPS;

  // hranice viet podľa páuz v hlase
  let bounds=null;
  if(voice){
    const d=voice.getChannelData(0), win=Math.round(SR*0.02), rms=[];
    for(let i=0;i+win<=d.length;i+=win){ let s=0; for(let j=0;j<win;j++) s+=d[i+j]*d[i+j]; rms.push(Math.sqrt(s/win)); }
    let mx=0; for(const v of rms) if(v>mx) mx=v;
    const thr=mx*0.06, gaps=[]; let s0=-1;
    rms.forEach((v,i)=>{ if(v<thr){ if(s0<0) s0=i; } else { if(s0>=0){ const len=i-s0; if(len*0.02>=0.14) gaps.push({t:(s0+len/2)*0.02,len}); s0=-1; } } });
    let first=0; while(first<rms.length&&rms[first]<thr) first++;
    let last=rms.length-1; while(last>0&&rms[last]<thr) last--;
    const fT=first*0.02, lT=last*0.02;
    const L=SC.lens; let tot=0; for(const l of L) tot+=l;
    const cand=gaps.filter(g=>g.t>fT+0.4&&g.t<lT-0.4); const pick=[]; let acc=0, prev=fT;
    for(let k=0;k<NS-1;k++){ acc+=L[k]; const e=fT+(lT-fT)*acc/tot; let best=null, bs=1e9;
      for(const g of cand){ if(g.t<=prev+0.3) continue; const sc=Math.abs(g.t-e)-0.6*g.len*0.02; if(sc<bs){ bs=sc; best=g; } }
      if(!best||Math.abs(best.t-e)>2.5){ pick.length=0; break; } pick.push(best.t); prev=best.t; }
    if(pick.length===NS-1) bounds=[fT].concat(pick,[lT+0.3]);
  }
  if(!bounds){ const L=SC.lens; let tot=0; for(const l of L) tot+=l; let acc=0.1; bounds=[acc]; for(const l of L){ acc+=l/tot*(vDur-0.3); bounds.push(acc); } }
  bounds=bounds.map(b=>b+VO);
  window.__reelBounds=bounds;

  // kamera
  const run=RUNS[0], p0=people[0], len=run.len, th=run.th;
  const cyc=p0.down+len/LIFT_V;
  const tCut=bounds[2]-0.05;
  const T0=8*cyc-p0.phase*cyc-tCut;
  const DIR=new THREE.Vector3(Math.cos(th),0,Math.sin(th)), TAN=new THREE.Vector3(-Math.sin(th),0,Math.cos(th));
  const sk=new THREE.Vector3();
  const P=(s,lat,dy)=>{ const v=runPt(run,s,lat,new THREE.Vector3()); v.y+=dy; return v; };
  const UPV=(y)=>new THREE.Vector3(0,y,0);
  function skAt(T){ skierOrg(p0,T,tmp); sk.set(tmp.x,tmp.y,tmp.z); const r=Math.hypot(sk.x,sk.z); let dth=Math.atan2(sk.z,sk.x)-th; while(dth>Math.PI) dth-=2*Math.PI; while(dth<-Math.PI) dth+=2*Math.PI; return {s:tmp.s, mode:tmp.mode, lat:dth*r}; }
  const SHOTS={
    aerial:(t,i)=>{ const k=ease(Math.min(1,t/(bounds[1]+1.2))); return {p:P(1.32,-170,240).lerp(P(1.06,-110,140),k), q:P(.42,10,0)}; },
    chair:(t,i)=>({ p:sk.clone().addScaledVector(TAN,15).addScaledVector(DIR,11).add(UPV(2.5)), q:sk.clone().add(UPV(1.2)) }),
    chase:(t,i)=>({ p:P(i.s-13/len, i.lat*0.65, 5.2), q:sk.clone().addScaledVector(DIR,14).add(UPV(-1)) }),
    side:(t,i)=>({ p:P(Math.min(1,i.s+5/len),i.lat-15,2.6), q:sk.clone().add(UPV(1)) }),
    crane:(t,i)=>{ const k=ease(Math.min(1,Math.max(0,(t-bounds[5])/(DUR-bounds[5])))); return { p:P(Math.max(0,i.s-(20+70*k)/len), -12*k, 7+110*k), q:P(Math.min(1,i.s+(8+90*k)/len),0,0) }; },
  };
  const TL=[{t:0,s:'aerial',b:0},{t:bounds[1]-0.3,s:'chair',b:1.3},{t:tCut,s:'chase',b:0},{t:bounds[3]+0.2,s:'side',b:1.0},{t:bounds[4]+0.2,s:'chase',b:1.0},{t:bounds[5],s:'crane',b:1.2}];
  function camAt(t,T){
    const info=skAt(T);
    let i=0; for(let k=0;k<TL.length;k++) if(t>=TL[k].t) i=k;
    const A=SHOTS[TL[i].s](t,info);
    if(i>0&&TL[i].b>0&&t<TL[i].t+TL[i].b){ const B=SHOTS[TL[i-1].s](t,info), k=ease((t-TL[i].t)/TL[i].b); A.p=B.p.lerp(A.p,k); A.q=B.q.lerp(A.q,k); }
    const gy=groundAt(A.p.x,A.p.z)+2; if(A.p.y<gy) A.p.y=gy;
    return A;
  }

  // grafika
  const cv2=document.createElement('canvas'); cv2.width=W; cv2.height=H2; const g=cv2.getContext('2d');
  const rr=(x,y,w,h,r)=>{ g.beginPath(); g.roundRect(x,y,w,h,r); };
  const backOut=x=>1+2.70158*Math.pow(x-1,3)+1.70158*Math.pow(x-1,2);
  function capDraw(lines,cy,size,segT){
    if(segT<0) return;
    const k=Math.min(1,segT/0.22), sc=0.82+0.18*backOut(k), al=Math.min(1,segT/0.12);
    g.save(); g.globalAlpha=al; g.translate(W/2,cy); g.scale(sc,sc);
    g.font='800 '+size+'px '+FONT;
    const parsed=lines.map(l=>l.split('*').map((s,j)=>({s,hl:j%2===1})).filter(x=>x.s));
    const widths=parsed.map(segs=>segs.reduce((a,x)=>a+g.measureText(x.s).width,0));
    const f=Math.min(1,900/Math.max(...widths)), sz=size*f;
    g.font='800 '+sz+'px '+FONT; g.textBaseline='middle'; g.textAlign='left'; g.lineJoin='round';
    const lh=sz*1.2, y0=-(lines.length-1)*lh/2;
    parsed.forEach((segs,li)=>{ let x=-widths[li]*f/2; const y=y0+li*lh;
      for(const it of segs){ g.lineWidth=sz*0.2; g.strokeStyle='rgba(16,20,28,.95)'; g.strokeText(it.s,x,y); g.fillStyle=it.hl?'#FFD23F':'#ffffff'; g.fillText(it.s,x,y); x+=g.measureText(it.s).width; } });
    g.restore();
  }
  function board(){
    g.save(); g.fillStyle='#1E5AA8'; rr(40,240,600,110,26); g.fill(); g.strokeStyle='#fff'; g.lineWidth=5; g.stroke();
    g.fillStyle='#fff'; g.font='800 44px '+FONT; g.textBaseline='middle'; g.textAlign='left'; g.fillText('Svah followerov',72,296);
    g.textAlign='right'; g.font='800 20px '+FONT; g.fillText('NA SVAHU',612,272); g.font='800 50px '+FONT; g.fillText('1',612,316); g.restore();
  }
  function tag(text,segT){
    const v=sk.clone().add(UPV(SK*1.7)).project(camera); if(v.z>1||Math.abs(v.x)>.95||Math.abs(v.y)>.95) return;
    const x=(v.x+1)/2*W, y=(1-v.y)/2*H2;
    g.save(); g.globalAlpha=Math.min(1,segT/0.2); g.font='700 38px '+FONT; const w=g.measureText(text).width+44;
    g.fillStyle='#1E5AA8'; rr(x-w/2,y-82,w,62,31); g.fill(); g.beginPath(); g.moveTo(x-14,y-21); g.lineTo(x+14,y-21); g.lineTo(x,y-4); g.fill();
    g.fillStyle='#fff'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,x,y-51); g.restore();
  }
  function bibCard(segT){
    const k=Math.min(1,segT/0.35), y=600+(1-backOut(k))*60; g.save(); g.globalAlpha=Math.min(1,segT/0.2);
    g.fillStyle='rgba(255,255,255,.96)'; rr(150,y-110,780,220,34); g.fill();
    g.fillStyle='#F4F6F9'; g.strokeStyle='#22262d'; g.lineWidth=6; rr(185,y-80,160,160,20); g.fill(); g.stroke();
    g.fillStyle='#5d6672'; g.font='800 26px '+FONT; g.textAlign='center'; g.textBaseline='middle'; g.fillText('ŠTART',265,y-45);
    g.fillStyle='#22262d'; g.font='800 72px '+FONT; g.fillText('2',265,y+18);
    g.textAlign='left'; g.font='800 54px '+FONT; g.fillText('@tvoje_meno',380,y-30);
    g.fillStyle='#5d6672'; g.font='600 34px '+FONT; g.fillText('tvoj lyžiar · tvoja farba',380,y+38);
    g.restore();
  }
  function chips(segT){
    const cols=['#C8102E','#1E5AA8','#F2B705','#2E9E5B','#7A3FB8','#E84A8A','#FFFFFF','#2B2D31'];
    if(SC.chips==='colors') cols.forEach((c,i)=>{ const k=Math.min(1,Math.max(0,(segT-0.15-i*0.06)/0.25)); if(k<=0) return; const r=26*backOut(k); const x=W/2+(i-(cols.length-1)/2)*78;
      g.save(); g.fillStyle=c; g.strokeStyle='#fff'; g.lineWidth=5; g.beginPath(); g.arc(x,1345,r,0,Math.PI*2); g.fill(); g.stroke(); g.restore(); });
    const items=SC.chips==='upgrades'?['🚡 lanovka','⛷️ nové zjazdovky','💡 tvoj nápad']:['⛷️ lyže','🏂 snowboard','🛷 sánky'];
    g.save(); g.font='800 40px '+FONT; const ws=items.map(s=>g.measureText(s).width+48); let tot=ws.reduce((a,b)=>a+b,0)+24*2; let x=(W-tot)/2;
    items.forEach((s,i)=>{ const k=Math.min(1,Math.max(0,(segT-0.6-i*0.15)/0.25)); if(k>0){ g.globalAlpha=k; const yy=1430+(1-backOut(k))*30;
      g.fillStyle='#fff'; rr(x,yy-36,ws[i],72,36); g.fill(); g.fillStyle='#22262d'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(s,x+ws[i]/2,yy+2); }
      x+=ws[i]+24; });
    g.restore();
  }
  const CAP=SC.caps;
  function overlay(t){
    const gr=g.createLinearGradient(0,960,0,H2); gr.addColorStop(0,'rgba(10,20,35,0)'); gr.addColorStop(1,'rgba(10,20,35,.45)'); g.fillStyle=gr; g.fillRect(0,960,W,H2-960);
    board();
    let seg=0; for(let i=0;i<NS;i++) if(t>=bounds[i]) seg=i;
    const segT=seg===0?t+0.3:t-bounds[seg];
    if(seg===1||seg===2) tag('#1 @svah.followerov',seg===1?segT:1);
    if(seg===2) bibCard(segT);
    if(seg===3) chips(segT);
    if(seg<6) capDraw(CAP[seg],[900,1180,880,1180,900,900][seg],86,segT);
    else {
      const al=Math.min(1,segT/0.3); g.fillStyle='rgba(10,18,30,'+(0.38*al)+')'; g.fillRect(0,0,W,H2); board();
      capDraw(['Ideš na *svah*?'],860,124,segT);
      capDraw(['Daj *follow* a napíš','koment 👇'],1060,62,segT-0.5);
    }
  }
  const nearSet=new Set([runObjs[0]]);
  const snowArr=snow.geometry.attributes.position.array;
  selected=0;
  { const os=scene.getObjectByName('openSign'); if(os) os.visible=false; }
  function renderFrame(t){
    const T=T0+t; U.uTime.value=T;
    updatePositions(T,nearSet);
    const sh=camAt(t,T); camera.position.copy(sh.p); camera.lookAt(sh.q); camera.updateMatrixWorld();
    updateDetail(nearSet);
    for(let i=1;i<snowArr.length;i+=3){ snowArr[i]-=.3; if(snowArr[i]<0) snowArr[i]+=260; }
    snow.geometry.attributes.position.needsUpdate=true; snow.position.set(camera.position.x,camera.position.y-130,camera.position.z);
    renderer.render(scene,camera);
    g.drawImage(renderer.domElement,0,0,W,H2);
    overlay(t);
  }

  if(params.get('reel')==='preview'){
    cv2.style.cssText='position:fixed;left:50%;top:0;height:100vh;transform:translateX(-50%);z-index:40';
    document.body.appendChild(cv2);
    window.__reelShow=t=>{ renderFrame(t); return {t,bounds,DUR}; };
    renderFrame(Math.min(DUR-0.1,bounds[2]+1));
    say('Náhľad: '+DUR.toFixed(1)+' s'+(voice?'':' (bez hlasu)'));
    return;
  }
  if(!voice){ say('Chýba hlas – najprv ho prenes cez transfer.html'); return; }

  // zvuk: hlas + jemná hudba + vietor + zvonce
  say('Mixujem zvuk…');
  const nTot=Math.ceil(DUR*SR), oc=new OfflineAudioContext(2,nTot,SR);
  const music=oc.createGain(); music.connect(oc.destination);
  music.gain.setValueAtTime(1,0); music.gain.linearRampToValueAtTime(0.5,VO+0.2); music.gain.setValueAtTime(0.5,VO+vDur); music.gain.linearRampToValueAtTime(1,VO+vDur+0.4); music.gain.setValueAtTime(1,DUR-1); music.gain.linearRampToValueAtTime(0,DUR);
  { const nb=oc.createBuffer(2,SR*2,SR); for(let c=0;c<2;c++){ const d=nb.getChannelData(c); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
    const ns=oc.createBufferSource(); ns.buffer=nb; ns.loop=true; const nf=oc.createBiquadFilter(); nf.type='lowpass'; nf.frequency.value=420; const ng=oc.createGain(); ng.gain.value=0.12; ns.connect(nf).connect(ng).connect(music); ns.start(0); }
  { const chords=[[261.63,329.63,392.0],[196.0,246.94,392.0],[220.0,261.63,329.63],[174.61,220.0,261.63]];
    const pf=oc.createBiquadFilter(); pf.type='lowpass'; pf.frequency.value=1600; pf.connect(music);
    for(let i=0,t=0;t<DUR;i++,t+=3){ const ch=chords[i%4];
      for(const f of ch) for(const det of [-5,5]){ const o=oc.createOscillator(); o.type='triangle'; o.frequency.value=f; o.detune.value=det; const e=oc.createGain(); e.gain.setValueAtTime(0,t); e.gain.linearRampToValueAtTime(0.02,t+0.5); e.gain.setValueAtTime(0.02,t+2.6); e.gain.linearRampToValueAtTime(0,t+3.3); o.connect(e).connect(pf); o.start(t); o.stop(Math.min(DUR,t+3.4)); }
      const arp=[0,1,2,1,0,1,2,1];
      arp.forEach((ni,j)=>{ const tt=t+j*0.375; if(tt>=DUR) return; const o=oc.createOscillator(); o.type='sine'; o.frequency.value=ch[ni]*2; const e=oc.createGain(); e.gain.setValueAtTime(0,tt); e.gain.linearRampToValueAtTime(0.05,tt+0.01); e.gain.exponentialRampToValueAtTime(0.0005,tt+0.35); o.connect(e).connect(pf); o.start(tt); o.stop(tt+0.4); }); } }
  { const nb=oc.createBuffer(1,SR,SR), d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const s=oc.createBufferSource(); s.buffer=nb; const bp=oc.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.2; bp.frequency.setValueAtTime(300,tCut-0.35); bp.frequency.exponentialRampToValueAtTime(3500,tCut+0.25);
    const e=oc.createGain(); e.gain.setValueAtTime(0,tCut-0.35); e.gain.linearRampToValueAtTime(0.35,tCut); e.gain.linearRampToValueAtTime(0,tCut+0.4); s.connect(bp).connect(e).connect(oc.destination); s.start(tCut-0.35); s.stop(tCut+0.5); }
  function bellAt(t0,base){ for(let r=0;r<3;r++){ const t=t0+r*0.16; const e=oc.createGain(); e.connect(oc.destination); e.gain.setValueAtTime(0.0001,t); e.gain.exponentialRampToValueAtTime(0.14,t+0.005); e.gain.exponentialRampToValueAtTime(0.0001,t+0.6);
      const bp=oc.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=base*1.3; bp.Q.value=2.5; bp.connect(e);
      for(const m of [1,1.48]){ const o=oc.createOscillator(); o.type='square'; o.frequency.value=base*m; o.connect(bp); o.start(t); o.stop(t+0.65); } } }
  bellAt(bounds[6]+0.05,880); bellAt(bounds[6]+0.75,740);
  { const s=oc.createBufferSource(); s.buffer=voice; const vg=oc.createGain(); vg.gain.value=1; s.connect(vg).connect(oc.destination); s.start(VO); }
  const mix=await oc.startRendering();
  { let pk=0; for(let c=0;c<2;c++){ const d=mix.getChannelData(c); for(let i=0;i<d.length;i++){ const a=Math.abs(d[i]); if(a>pk) pk=a; } }
    const k=pk>0?0.95/pk:1; for(let c=0;c<2;c++){ const d=mix.getChannelData(c); for(let i=0;i<d.length;i++) d[i]*=k; } }

  say('Načítavam kóder…');
  let M=null; for(const v of ['5.1.3','5.1.0','5.0.0','4.3.3']){ try{ M=await import('https://cdn.jsdelivr.net/npm/mp4-muxer@'+v+'/+esm'); break; }catch(e){} }
  if(!M){ say('Nepodarilo sa načítať mp4-muxer'); return; }
  let vcodec=null; for(const c of ['avc1.640028','avc1.4d0028','avc1.42e028']){ try{ const s=await VideoEncoder.isConfigSupported({codec:c,width:W,height:H2,bitrate:9e6,framerate:FPS}); if(s.supported){ vcodec=c; break; } }catch(e){} }
  if(!vcodec){ say('Tento prehliadač nevie kódovať H.264'); return; }
  let aac=false; try{ aac=(await AudioEncoder.isConfigSupported({codec:'mp4a.40.2',sampleRate:SR,numberOfChannels:2,bitrate:160000})).supported; }catch(e){}
  if(!aac){ say('Tento prehliadač nevie kódovať AAC zvuk'); return; }
  const muxer=new M.Muxer({ target:new M.ArrayBufferTarget(), video:{codec:'avc',width:W,height:H2}, audio:{codec:'aac',numberOfChannels:2,sampleRate:SR}, fastStart:'in-memory', firstTimestampBehavior:'offset' });
  let encErr=null;
  const aenc=new AudioEncoder({output:(c,m)=>muxer.addAudioChunk(c,m), error:e=>{ encErr=e; }});
  aenc.configure({codec:'mp4a.40.2',sampleRate:SR,numberOfChannels:2,bitrate:160000});
  { const L=mix.getChannelData(0), R=mix.getChannelData(1), CH=1024;
    for(let i=0;i<mix.length;i+=CH){ const n=Math.min(CH,mix.length-i); const d=new Float32Array(n*2); d.set(L.subarray(i,i+n),0); d.set(R.subarray(i,i+n),n);
      const ad=new AudioData({format:'f32-planar',sampleRate:SR,numberOfFrames:n,numberOfChannels:2,timestamp:Math.round(i/SR*1e6),data:d}); aenc.encode(ad); ad.close(); }
    await aenc.flush(); }
  const venc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m), error:e=>{ encErr=e; }});
  venc.configure({codec:vcodec,width:W,height:H2,bitrate:9e6,framerate:FPS,avc:{format:'avc'}});
  const NF=Math.round(DUR*FPS);
  for(let f=0;f<NF;f++){
    const t=f/FPS; renderFrame(t);
    const vf=new VideoFrame(cv2,{timestamp:Math.round(t*1e6),duration:Math.round(1e6/FPS)});
    venc.encode(vf,{keyFrame:f%60===0}); vf.close();
    while(venc.encodeQueueSize>4) await new Promise(r=>setTimeout(r,4));
    if(f%15===0){ say('Renderujem video… '+Math.round(f/NF*100)+' %'); await new Promise(r=>setTimeout(r,0)); }
    if(encErr){ say('Chyba kódovania: '+encErr.message); return; }
  }
  await venc.flush(); muxer.finalize();
  const blob=new Blob([muxer.target.buffer],{type:'video/mp4'});
  await dbPut(SC.out,blob);
  window.__reelInfo={size:blob.size,dur:DUR,frames:NF,codec:vcodec};
  const vid=document.createElement('video'); vid.src=URL.createObjectURL(blob); vid.controls=true; vid.muted=true;
  vid.style.cssText='position:fixed;left:50%;top:0;height:100vh;transform:translateX(-50%);z-index:40;background:#000'; document.body.appendChild(vid);
  say('Hotovo: '+(blob.size/1e6).toFixed(1)+' MB, '+DUR.toFixed(1)+' s – uložené pre Instagram');
}
if(REEL) startReel().catch(e=>{ const d=document.createElement('div'); d.style.cssText='position:fixed;left:12px;bottom:12px;z-index:70;background:#fff;padding:10px;color:#C8102E;font:600 14px system-ui'; d.textContent='Chyba: '+e.message; document.body.appendChild(d); window.__reelStatus='Chyba: '+e.message; });
